[package]
name = "camlib"
version = "0.1.2"
description = "Personal camera media library desktop app (Windows-first)"
authors = ["LiuQingDo"]
edition = "2021"
license = "MIT"
repository = "https://github.com/LiuQingDo/Camlib"
homepage = "https://github.com/LiuQingDo/Camlib"
readme = "../README.md"
keywords = ["camera", "media-library", "photo", "backup", "tauri"]
categories = ["multimedia::images", "filesystem"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "d_code_collect_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "collation"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
exif = { package = "kamadak-exif", version = "0.6" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"

# Thumbnail creation is exercised constantly while developing. Without this,
# large JPEGs are decoded by unoptimised dependency code and can take many
# seconds each even though release builds are fast.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3
