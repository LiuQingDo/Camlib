<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f0f0f0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Camlib · 媒体库</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <!-- Embedded window chrome: same surface as the app, not a separate glass strip. -->
    <header class="titlebar" id="app-titlebar">
      <div class="titlebar-left" data-tauri-drag-region></div>
      <div class="titlebar-spacer" data-tauri-drag-region></div>
      <div class="titlebar-controls">
        <button class="titlebar-button" id="titlebar-minimize" type="button" aria-label="最小化" title="最小化"></button>
        <button class="titlebar-button" id="titlebar-maximize" type="button" aria-label="最大化" title="最大化"></button>
        <button class="titlebar-button titlebar-close" id="titlebar-close" type="button" aria-label="关闭" title="关闭"></button>
      </div>
    </header>
    <div id="app"></div>
  </body>
</html>
